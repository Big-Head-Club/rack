<meta charset="utf-8">
<title>Hundred Carts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 32'%3E%3Crect x='1' y='1' width='18' height='30' rx='3' fill='%23c9c3b4'/%3E%3Crect x='4' y='4' width='12' height='13' fill='%232b3222'/%3E%3Cg fill='%238e8879'%3E%3Crect x='4' y='24' width='1.6' height='6'/%3E%3Crect x='7' y='24' width='1.6' height='6'/%3E%3Crect x='10' y='24' width='1.6' height='6'/%3E%3Crect x='13' y='24' width='1.6' height='6'/%3E%3C/g%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ---------- tokens: bare :root = light (a drawer opened in daylight) ---------- */
  :root{
    --bg:        #dcd8d0;
    --bg-lit:    #eceae3;
    --ink:       #1d1f19;
    --dim:       #6e7267;
    --recess:    #cfcbc2;
    --recess-sh: rgba(56,60,48,.42);
    --recess-hi: rgba(255,255,255,.68);
    --shadow-c:  rgba(38,42,33,.42);
    --shadow-soft:rgba(38,42,33,.22);
    /* The brand is the orange off the tower cartridge. It carries the accents, the pips and
       the light the machine sits in; the readout stays phosphor green because that is a
       property of the glass, not a choice about the house. */
    --accent:    #b8420c;
    --pip:       #cb470d;
    --pip-glow:  rgba(203,71,13,.38);
    --halo:      rgba(190,92,30,.17);
    /* the console's own plastic: light grey top surface, near-black slot */
    --deck1:     #bdb9af;
    --deck2:     #97948b;
    --deck-lip:  #efeee7;
    --deck-seam: rgba(45,48,38,.22);
    --deck-vent: rgba(45,48,38,.30);
    --slot:      #2b2d26;
    /* the readout is an object: dark in both themes */
    --well1:     #2b3221;
    --well2:     #171c10;
    --well-ink:  #bcd464;
    /* One shell for the whole rack. MJ gave the ten carts ten slightly different shapes,
       0.620 to 0.703 wide-to-tall, and a shoebox of mismatched mouldings is not what this is
       — it is one system, a hundred games. Everything is cut to the hare's proportion, the
       narrowest and cleanest of them, and each photograph is stretched to fill it. Every cut
       carries the same 5% of air on both axes, so filling a common box puts every shell at
       exactly the same size; the widest has to give up 11% of its width to get there, which
       nobody can see without the original beside it. */
    --cart-a: .623;
    --serif: 'Didot','Bodoni 72','Hoefler Text',Garamond,'Times New Roman',serif;
    --grot:  'Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:  ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:        #121410;
      --bg-lit:    #1d2118;
      --ink:       #dfe4d2;
      --dim:       #7d8472;
      --recess:    #0d0f0b;
      --recess-sh: rgba(0,0,0,.65);
      --recess-hi: rgba(226,240,196,.06);
      --shadow-c:  rgba(0,0,0,.6);
      --shadow-soft:rgba(0,0,0,.38);
      --accent:    #f2812f;
      --pip:       #ff8a3d;
      --pip-glow:  rgba(255,138,61,.38);
      --halo:      rgba(222,112,46,.15);
      --deck1:     #262a20;
      --deck2:     #171a12;
      --deck-lip:  #4e5344;
      --deck-seam: rgba(0,0,0,.5);
      --deck-vent: rgba(0,0,0,.55);
      --slot:      #050603;
    }
  }
  :root[data-theme="dark"]{
    --bg:        #121410;
    --bg-lit:    #1d2118;
    --ink:       #dfe4d2;
    --dim:       #7d8472;
    --recess:    #0d0f0b;
    --recess-sh: rgba(0,0,0,.65);
    --recess-hi: rgba(226,240,196,.06);
    --shadow-c:  rgba(0,0,0,.6);
    --shadow-soft:rgba(0,0,0,.38);
    --accent:    #f2812f;
    --pip:       #ff8a3d;
    --pip-glow:  rgba(255,138,61,.38);
    --halo:      rgba(222,112,46,.15);
    --deck1:     #262a20;
    --deck2:     #171a12;
    --deck-lip:  #4e5344;
    --deck-seam: rgba(0,0,0,.5);
    --deck-vent: rgba(0,0,0,.55);
    --slot:      #050603;
  }

  html{ -webkit-text-size-adjust:100% }
  body{
    margin:0;
    background-color:var(--bg);
    background-image:radial-gradient(130% 62% at 50% -8%, var(--bg-lit), var(--bg) 82%);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:var(--grot);
    overflow-x:hidden;
    min-height:100vh;
  }
  *,*::before,*::after{ box-sizing:border-box }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer }
  button:focus{ outline:none }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:4px }

  .page{
    position:relative; z-index:1;
    max-width:1020px;
    margin:0 auto;
    padding:clamp(48px,9vh,110px) clamp(16px,4vw,40px) 0;
    display:flex; flex-direction:column; align-items:center;
  }

  /* ---------- 0 · site nav: three words, the same on every page ---------- */
  .site{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin:0 0 clamp(30px,5vh,52px);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.24em;
  }
  .site a{ color:var(--dim); text-decoration:none; padding:4px 2px 5px; border-bottom:1px solid transparent }
  .site a:hover{ color:var(--ink) }
  .site a[aria-current]{ color:var(--ink); border-bottom-color:var(--accent) }
  .site .vdiv{ width:1px; height:11px; background:currentColor; opacity:.25 }

  /* ---------- 1 · wordmark ---------- */
  .mast{ text-align:center }
  .wordmark{
    margin:0;
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(2.7rem,8vw,5rem);
    line-height:.98;
    letter-spacing:-.015em;
    text-wrap:balance;
  }
  .wordmark .n{ font-variant-numeric:lining-nums }
  .count{
    margin-top:clamp(18px,3vh,28px);
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:.95rem;
    letter-spacing:.28em;
    color:var(--dim);
  }
  .count b{ font-weight:400; color:var(--ink) }

  /* ---------- 2 · the cartridge, shared by every place one appears ----------
     Every cart on the page is a pair of layers. The photograph and its silhouette mask sit
     on the inner element together with that cart's own colour grade; the outer one carries
     nothing but the drop-shadow. That order matters: a filter is applied before the element's
     mask, so a drop-shadow on the same layer as the mask would trace the photo's rectangle
     instead of the cartridge. On the parent it sees the cut-out shape.

     The box is the same shape everywhere on the page (`--cart-a`) and the photograph fills
     it, so every cartridge is the same size as every other and as the slot it goes into. */
  .ph > i{
    position:absolute; inset:0; display:block;
    background-size:100% 100%; background-repeat:no-repeat;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  }

  /* ---------- 3 · the console: the bottom of the page is its top surface ----------
     The page does not sit above a console, it sits ON one. The surface runs the full width
     and off the bottom edge, so the cartridge you are looking at all the way down the page
     turns out to have been standing in a slot the whole time. Three bands do the work: the
     dark mouth behind the cart, the cart, and the near half of the surface drawn over it. */
  .console{
    /* The cart's width is the unit everything here is cut from, and the script writes it in
       from the rack's own column width: a cartridge is one object, so it has to be the same
       size standing in the machine as it is sitting on the shelf. Everything else — the
       machine's width, the slot, the section's height — is a multiple of it, which is why
       none of this is expressed in percentages any more. */
    --cart-w:260px;
    --cart-h:calc(var(--cart-w) / var(--cart-a));
    --machine:min(88vw, calc(var(--cart-w) * 2.7));
    --machine-r:16px;
    --body:clamp(210px,29vh,300px);          /* the machine below the slot */
    --seat:calc(var(--cart-h) - 40px);       /* travel, leaving a constant stub proud */
    position:relative; z-index:1;
    width:100%;
    height:calc(var(--cart-h) + var(--body) + clamp(22px,4vh,52px));
    margin-top:clamp(70px,11vh,120px);
    overflow:hidden;
    isolation:isolate;
  }
  /* the light the standing cart sits in */
  .console::before{
    content:""; position:absolute; left:50%; bottom:calc(var(--body) * .5);
    width:min(84vw,640px); aspect-ratio:1.35;
    transform:translate(-50%,50%);
    border-radius:50%;
    background:radial-gradient(closest-side, var(--halo) 0%, transparent 68%);
    animation:breathe 4.2s ease-in-out infinite alternate;
  }
  @keyframes breathe{ from{ opacity:.55 } to{ opacity:1 } }

  /* The machine is an OBJECT poking up out of the bottom of the page, not a surface the page
     rests on. Both of its halves are cut to the same width and centred so their side walls
     line up, and neither has a bottom radius — the body runs off the end of the document and
     is cut there, which is what sells "there is more of this below the fold". */
  .far, .near{
    left:50%; transform:translateX(-50%);
    width:var(--machine);
  }
  /* the far side: the machine's back edge and the plastic behind the slot */
  .far{
    position:absolute; bottom:calc(var(--body) - 2px); height:clamp(40px,6vh,62px);
    z-index:1;
    border-radius:var(--machine-r) var(--machine-r) 0 0;
    background:linear-gradient(180deg, var(--deck-lip) 0 1px, var(--deck2) 2px);
  }
  /* the slot itself — a slit only as wide as a cartridge. A full-width dark band read as a
     gap between two surfaces; a port has to be a hole in one surface. */
  .mouth{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(var(--body) + 4px); width:calc(var(--cart-w) + 15px); height:clamp(20px,3vh,30px);
    z-index:1;
    border-radius:2px;
    background:var(--slot);
    box-shadow:
      inset 0 5px 7px -2px #000,
      inset 0 0 0 1px rgba(0,0,0,.6),
      0 1px 0 var(--deck-lip);
  }
  /* the near side: everything between the mouth and the reader, drawn OVER the cart */
  .near{
    position:absolute; bottom:0; height:var(--body);
    z-index:3;
    background:linear-gradient(180deg, var(--deck-lip) 0 1px, var(--deck1) 2px, var(--deck2) 210%);
    box-shadow:
      0 -14px 24px -16px rgba(0,0,0,.55),
      inset 1px 0 0 var(--deck-lip),
      inset -1px 0 0 rgba(0,0,0,.4),
      0 30px 54px -20px var(--shadow-c);
    display:flex; flex-direction:column; align-items:center;
    padding-top:clamp(26px,4.5vh,44px);
    gap:clamp(14px,2.4vh,22px);
  }
  /* moulded detail: a seam, two screw wells, a vent. Enough that it reads as a made object
     and no more — the cartridge is the thing being looked at. */
  .near::before{
    content:""; position:absolute; left:0; right:0; top:clamp(14px,2.4vh,22px);
    height:1px; background:var(--deck-seam);
  }
  .screw{
    position:absolute; top:clamp(30px,5vh,50px);
    width:9px; height:9px; border-radius:50%;
    background:var(--slot);
    box-shadow:inset 0 1px 1px rgba(0,0,0,.8), 0 1px 0 var(--deck-lip);
  }
  .screw.l{ left:clamp(16px,5%,34px) }
  .screw.r{ right:clamp(16px,5%,34px) }
  .vent{
    width:calc(var(--cart-w) * 1.6); height:clamp(16px,2.6vh,26px);
    margin-top:clamp(8px,2vh,20px);
    border-radius:2px;
    background:repeating-linear-gradient(90deg, var(--deck-vent) 0 2px, transparent 2px 9px);
    opacity:.85;
  }

  /* the cartridge standing in the mouth */
  .stage{
    position:absolute; left:50%; top:0; bottom:0;
    width:var(--cart-w);
    transform:translateX(-50%);
    z-index:2;
  }
  /* The box IS the cartridge: its width is the machine's unit and its shape is the house
     shell. Every cart stands the same size in the same slot, the bases all land on the same
     line, and one constant travel buries every one of them to the same depth. */
  .cart{
    position:absolute; left:0; right:0;
    bottom:calc(var(--body) + 8px); height:var(--cart-h);
    display:block;
    transform:translateY(0);
    /* A cartridge does not drop into a slot, it is pushed. 0.8s read as a flick; this is a
       hand's worth of travel, and the seat sound, the glow and the flood are all timed off it. */
    transition:transform 1.5s cubic-bezier(.42,.02,.35,1);
    will-change:transform;
  }
  .cart .ph{
    position:absolute; inset:0;
    filter:drop-shadow(0 22px 16px var(--shadow-c));
    transition:filter 1.5s cubic-bezier(.42,.02,.35,1);
  }
  .console.in .cart{ transform:translateY(var(--seat)) }
  .console.in .cart .ph{ filter:drop-shadow(0 5px 5px var(--shadow-soft)) }
  /* A cart that is loaded but not yet pushed in asks to be pushed. It rests for most of the
     cycle and then hops twice — a loop of constant motion down there would be a nag, and this
     has to sit under the whole page without wearing out its welcome.

     The nudge lives on the PHOTO layer, not on .cart. When it was on .cart it owned the same
     transform the seat transition needs, and removing the animation in the tick that starts
     the transition meant Chrome never interpolated at all: the cart teleported into the slot
     and no duration made any difference. Two layers, two jobs. */
  .cart.waiting .ph{ animation:nudge 3.1s cubic-bezier(.3,.7,.3,1) infinite }
  @keyframes nudge{
    0%,58%,100%{ transform:translateY(0) }
    66%{ transform:translateY(-8%) }
    74%{ transform:translateY(0) }
    80%{ transform:translateY(-2.6%) }
    86%{ transform:translateY(0) }
  }

  /* the readout: a strip of lit glass in the surface, dark until a cart is seated */
  .readout{
    width:calc(var(--cart-w) * 1.35);
    border-radius:3px;
    padding:.75em 1em;
    text-align:center;
    background:linear-gradient(180deg, var(--well2), var(--well1));
    box-shadow:
      inset 0 2px 5px rgba(0,0,0,.85),
      inset 0 0 0 1px rgba(0,0,0,.45),
      0 1px 0 var(--deck-lip);
  }
  .readout span{
    display:block;
    font-family:var(--mono);
    font-size:clamp(.62rem,2.2vw,.76rem);
    letter-spacing:.34em; text-indent:.34em;
    color:var(--well-ink);
    text-shadow:0 0 10px rgba(188,212,100,.5);
    opacity:0;
    transition:opacity .3s ease;
  }
  .console.in .readout span{ opacity:1; transition-delay:1.25s }

  .keep, .day-mark{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:.58rem;
    letter-spacing:.42em; text-indent:.42em;
    color:var(--dim);
    opacity:0;
    transition:opacity .3s ease, color .25s;
  }
  .keep{ pointer-events:none }
  .console.in .keep{ opacity:1; pointer-events:auto; transition-delay:1.4s }
  .console.in .day-mark{ opacity:1; transition-delay:1.4s }
  .keep:hover{ color:var(--ink) }
  .keep[hidden], .day-mark[hidden]{ display:none }

  /* The light that takes over when a cart seats. Not a fade: the light has a source. It
     starts inside the slot the cart just went into (--fx/--fy are written from the mouth's
     own rect at seat time) and swells out past the edges of the screen before it flattens.
     The flat layer stutters once on the way up, the way a tube catches before it strikes. */
  .flood{
    position:fixed; inset:0;
    z-index:99;
    opacity:0;
    pointer-events:none;
  }
  .flood.on{ opacity:1 }
  .flood i{ position:absolute; inset:0; display:block }
  .flood .flat{ background:var(--flare,#fff); opacity:0 }
  .flood.on .flat{ animation:strike 2.6s ease forwards }
  @keyframes strike{
    0%{ opacity:0 }
    16%{ opacity:.09 }
    21%{ opacity:.02 }
    46%{ opacity:1 }
    64%{ opacity:1 }
    100%{ opacity:0 }
  }
  /* The page used to pull back as the light arrived. It was invisible while the console was
     a full-width surface and wrong the moment it became an object: scaling and fading a
     stacking context with real edges made every layer inside it look like it had come loose.
     The light does the work on its own. */
  .glowfield{ position:fixed; inset:0; z-index:0; pointer-events:none }
  .glowfield i{
    position:absolute; left:var(--fx,50%); top:var(--fy,86%);
    display:block;
    width:150vmax; aspect-ratio:1;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(.15);
    /* the core is blown out white whatever is playing; the falloff carries the colourway */
    background:radial-gradient(closest-side,
      #fff 0 10%, var(--flare,#fff) 26%, var(--flare-mid,rgba(255,255,255,.5)) 46%,
      var(--flare-out,rgba(255,255,255,0)) 74%);
    opacity:0;
  }
  .glowfield.on i{ animation:spill 3.1s cubic-bezier(.22,.7,.3,1) .95s forwards }
  @keyframes spill{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.06) }
    16%{ opacity:.7; transform:translate(-50%,-50%) scale(.18) }
    44%{ opacity:1; transform:translate(-50%,-50%) scale(.55) }
    72%{ opacity:1; transform:translate(-50%,-50%) scale(1.1) }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.35) }
  }

  /* sound toggle: one glyph, bottom corner of the console */
  .snd{
    position:absolute; right:clamp(12px,4%,26px); bottom:clamp(12px,2.4vh,22px);
    z-index:5;
    font-size:.8rem;
    line-height:1;
    color:var(--dim);
    opacity:.5;
    transition:opacity .25s, color .25s;
  }
  .snd:hover{ opacity:1; color:var(--ink) }
  .snd[aria-pressed="true"]{ opacity:.22 }

  /* The rack shows one of two things, and this says which. Both counts are true at once —
     a hundred carts are coming and some number of them are yours — so the switch is a pair
     of equals rather than a filter hung off the side of the grid. */
  .view{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(12px,2vw,18px);
    margin-top:clamp(14px,2.4vh,22px);
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.28em;
  }
  .view button{
    color:var(--dim);
    text-indent:.28em;
    padding:.5em .2em;
    border-bottom:1px solid transparent;
    transition:color .2s ease, border-color .2s ease;
  }
  .view button:hover{ color:var(--ink) }
  .view button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--accent) }
  .view .vdiv{ width:1px; height:11px; background:var(--hairline, currentColor); opacity:.25 }
  .nowt{
    margin:clamp(40px,7vh,80px) 0 0;
    text-align:center;
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.4em; text-indent:.4em;
    color:var(--dim);
    opacity:.55;
  }
  .nowt[hidden]{ display:none }

  /* ---------- 4 · the rack ---------- */
  .shelf{
    margin-top:clamp(80px,13vh,150px);
    width:100%;
    max-width:920px;
  }
  .shelf-meta{
    display:flex; justify-content:flex-end; align-items:center; gap:9px;
    margin-bottom:clamp(18px,3vh,26px);
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:.85rem;
    letter-spacing:.24em;
    color:var(--dim);
  }
  .punch{
    width:11px; height:11px; border-radius:50%;
    background:var(--recess);
    box-shadow:inset 0 1.5px 3px var(--recess-sh), inset 0 -1px 0 var(--recess-hi);
    flex:none;
  }
  .grid{
    display:grid;
    /* three across a desktop, two on a tablet, one on a phone. `min(100%,…)` is what makes
       the single column possible: a bare 260px minimum would overflow a narrow screen rather
       than fall back to one. The carts are the collection, so they are sized to be looked at
       rather than counted. */
    grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));
    gap:clamp(14px,3vw,28px);
    /* the row gap carries the label tape under each cart */
    row-gap:clamp(48px,6vw,64px);
  }
  .tile{
    position:relative;
    aspect-ratio:var(--cart-a);
    transition:transform .3s ease;
  }
  .tile .ph{
    position:absolute; inset:0;
    filter:drop-shadow(0 5px 6px var(--shadow-soft));
  }
  .tile.has-photo:hover{ transform:translateY(-4px) scale(1.03) }

  /* The name, on a strip of label-maker tape stuck under the cart: white tape, black
     embossed capitals, the way anyone with a Dymo labels a shelf of things they own. It is
     stuck on slightly crooked because a straight one reads as a caption, not a label. The
     tape is an object, so it is white in both themes. */
  .tile .lbl{
    position:absolute; left:50%; top:calc(100% + 9px);
    transform:translateX(-50%) rotate(var(--tilt, -1.2deg));
    max-width:100%;
    padding:.5em .9em .44em;
    border-radius:3px;
    background:linear-gradient(#fbfaf6, #ebe9e2 55%, #f4f2ec);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.18),
               0 1px 2px var(--shadow-c);
    font-family:var(--mono);
    font-size:.8rem; font-weight:700; line-height:1;
    letter-spacing:.18em; text-indent:.18em;
    white-space:nowrap;
    color:#151513;
    text-shadow:0 1px 0 rgba(255,255,255,.7), 0 -1px 0 rgba(0,0,0,.25);
    pointer-events:none;
  }
  /* the cut end of the tape: a hair of the roll's lead-in left on the right */
  .tile .lbl::after{
    content:""; position:absolute; top:0; bottom:0; right:0; width:4px;
    background:linear-gradient(90deg, transparent, rgba(0,0,0,.08));
  }
  .tile:nth-child(3n) .lbl{ --tilt:.9deg }
  .tile:nth-child(5n) .lbl{ --tilt:-.5deg }
  .tile:nth-child(7n) .lbl{ --tilt:1.6deg }

  /* today on the rack: underlit, breathing */
  .tile.today::before{
    content:""; position:absolute; inset:-26%;
    border-radius:50%;
    background:radial-gradient(circle, var(--halo) 0%, transparent 55%);
    animation:breathe 4.2s ease-in-out infinite alternate;
  }
  /* collected: punched mark */
  .tile .mark{
    position:absolute; right:8%; bottom:5%;
    /* percentage sizes blew up with the tiles — these are punch marks in a rack, not badges */
    width:clamp(10px,6%,17px); aspect-ratio:1;
    border-radius:50%;
    background:var(--bg);
    box-shadow:inset 0 2px 3px rgba(0,0,0,.6), inset 0 -1px 1px var(--recess-hi),
               0 1px 2px var(--shadow-soft);
  }
  /* refilled: one warm pip */
  .tile .pip{
    position:absolute; right:12%; top:7%;
    width:clamp(6px,3.2%,10px); aspect-ratio:1;
    border-radius:50%;
    background:var(--pip);
    box-shadow:0 0 7px 2px var(--pip-glow);
    animation:pip 3.4s ease-in-out infinite alternate;
  }
  @keyframes pip{ from{ opacity:.65 } to{ opacity:1 } }
  /* Locked: the number, and nothing else. A debossed box for a cart that does not exist yet
     is a lot of furniture for an absence, and at this tile size it read as a hole in the page
     rather than a slot waiting to be filled. */
  .tile.locked{
    cursor:default;
    display:flex; align-items:center; justify-content:center;
  }
  .tile.locked .num{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:.72rem;
    letter-spacing:.28em; text-indent:.28em;
    color:var(--dim);
    opacity:.3;
  }
  .tile.settling{ animation:settle .3s ease }
  @keyframes settle{
    0%{ transform:none }
    40%{ transform:translateY(2px) scale(.98) }
    100%{ transform:none }
  }

  /* tomorrow, at the head of the queue: dimmed, half in shadow, not yet arrived */
  .tile.tomorrow{ cursor:default }
  .tile.tomorrow .ph{
    -webkit-mask-image:linear-gradient(105deg, #000 34%, rgba(0,0,0,.22) 80%);
    mask-image:linear-gradient(105deg, #000 34%, rgba(0,0,0,.22) 80%);
  }
  .tile.tomorrow .soon{
    position:absolute; left:0; right:0; bottom:-1.9em;
    text-align:center;
    font-family:var(--mono);
    font-size:.58rem;
    letter-spacing:.5em; text-indent:.5em;
    color:var(--dim);
  }


  @media (prefers-reduced-motion: reduce){
    .cart, .cart .ph, .tile, .tile .ph, .keep, .readout span, .day-mark,
    .page, .console{ transition-duration:.01s }
    .console::before, .tile.today::before, .tile .pip, .tile.settling,
    .cart.waiting .ph{ animation:none }
    /* the flood is the one thing that is genuinely a flash of light — it does not run here */
    .flood.on .flat, .glowfield.on i{ animation:none }
  }
  /* the game's label, rendered by the arcade at this shell's window size, printed into the
     photo window and lit from the upper left like the shell. */
  .label{ position:absolute; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.25), inset 0 0 6px rgba(0,0,0,.35) }
  .label img{ display:block; width:100%; height:100%; object-fit:fill }
  .label::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%, rgba(0,0,0,.14)) }
</style>

  /* Every live game on the build ledger, in the order they were started. Seating a cart IS
     playing it, so each one carries the address it launches — the light takes the screen and
     you arrive in the game. `a` is the shell it was dealt; the list is written in from
     tools/games.json by tools/rebuild.js, so edit it there. */
  const GAMES = __GAMES__;
  /* the printed photo window of each shell, as % of the cut: left, top, width, height.
     The arcade's plate for the game is printed there at request time, so a new game wears
     its own picture the moment it registers. */
  const LABELS = {"arch": [15.27, 15.0, 61.07, 52.0], "crown": [29.89, 11.25, 55.16, 44.25], "fish": [21.51, 16.5, 57.74, 49.5], "galaxy": [16.28, 11.5, 68.99, 67.0], "hare": [16.87, 10.75, 65.86, 43.75], "lighthouse": [17.12, 11.5, 66.54, 52.0], "moth": [19.33, 12.75, 60.97, 52.0], "scarab": [22.98, 12.25, 53.63, 45.0], "tower": [29.12, 10.0, 54.02, 44.5], "whale": [26.77, 10.0, 57.48, 54.5]};
  const ARCADE = "__ARCADE__";
  const DAY = GAMES.length;
  const refilled  = new Set();

  /* ---------- the stream ----------
     Keeping a cart and subscribing to its game are the same act — a kept cart reopens
     forever, which is what a subscription is — so there is one list, it lives here on the
     menu's origin, and the punch mark on a tile is what it looks like. Games cannot write to
     it from inside themselves (browsers partition third-party storage), so the tray bounces
     through here with ?sub= and this end records it and sends the player straight back. */
  const STREAM = "carts.stream";
  const collected = new Set();
  function readStream(){
    try { return new Set(JSON.parse(localStorage.getItem(STREAM) || "[]")); }
    catch (e){ return new Set(); }
  }
  function writeStream(slugs){
    try { localStorage.setItem(STREAM, JSON.stringify([...slugs])); } catch (e){}
  }
  (function boot(){
    const subs = readStream();
    const q = new URLSearchParams(location.search);
    const on = q.get("sub"), off = q.get("unsub");
    if (on) subs.add(on);
    if (off) subs.delete(off);
    if (on || off) writeStream(subs);
    GAMES.forEach((g, i) => { if (subs.has(g.s)) collected.add(i + 1); });
    const back = q.get("back");
    if ((on || off) && back && /^https?:\/\//.test(back)) location.replace(back);
  })();

  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* seeded, per-cart, stable across reloads */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const ART_KEYS = ["lighthouse","hare","crown","whale","scarab","arch","galaxy","moth","tower","fish"];
  function treatment(i){
    const r = mulberry32(0x9E3D + i * 7919);
    const g = GAMES[i - 1];
    return {
      art: (g && g.a) || ART_KEYS[(i * 3 + Math.floor(i / ART_KEYS.length)) % ART_KEYS.length],
      /* the game's own picture printed on the label — tools/plate-cart.js puts the ledger's
         plate into the shell's photo window. A game without one wears the shell's stock label. */
      photo: g ? ARCADE + "/labels/" + g.s : null,
      hue: (r() * 4 - 2),
      sat: .94 + r() * .12,
      bri: .95 + r() * .10,
      rot: (r() * 2.4 - 1.2),
      scl: .97 + r() * .05,

  }
  /* el is the shadow layer; everything else goes on the inner one it wraps */
  function applyPhoto(el, t, briMul, satMul, upright){
    const art = CART_ART[t.art];
    let i = el.firstElementChild;
    if (!i){ i = document.createElement("i"); el.appendChild(i); }
    i.style.backgroundImage = "url('" + art.p + "')";
    let lab = i.querySelector(".label");
    if (t.photo){
      if (!lab){ lab = document.createElement("span"); lab.className = "label"; lab.appendChild(document.createElement("img")); i.appendChild(lab); }
      const w = LABELS[t.art];
      lab.style.left = w[0] + "%"; lab.style.top = w[1] + "%"; lab.style.width = w[2] + "%"; lab.style.height = w[3] + "%";
      const img = lab.firstElementChild;
      if (img.getAttribute("src") !== t.photo){ img.src = t.photo; img.alt = ""; img.loading = "lazy"; }
    } else if (lab) lab.remove();
    i.style.webkitMaskImage = "url('" + art.m + "')";
    i.style.maskImage = "url('" + art.m + "')";
    i.style.filter =
      "hue-rotate(" + t.hue.toFixed(1) + "deg)" +
      " saturate(" + (t.sat * (satMul || 1)).toFixed(3) + ")" +
      " brightness(" + (t.bri * (briMul || 1)).toFixed(3) + ")";
    i.style.transform = (upright ? "" : "rotate(" + t.rot.toFixed(1) + "deg) ") +
      "scale(" + t.scl.toFixed(3) + ")";
  }

  const pad3 = n => String(n).padStart(3, "0");
  const pad2 = n => String(n).padStart(2, "0");

  /* ---------- sound ----------
     Synthesised, not sampled: a self-contained page cannot carry an audio file without
     doubling its weight, and the whole event is only four gestures anyway. A cartridge going
     in sounds like the shell sliding down its guides, the contacts seating, the machine
     coming up, and then the chord the light arrives on. They are scheduled on the audio
     clock rather than with timers so the seat lands with the cart and the chord with the
     white — a setTimeout would drift against both. */
  let actx = null, verb = null, master = null, muted = false;
  function ctxOf(){
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 5; comp.release.value = .3;
      master = actx.createGain();
      master.gain.value = .5;
      master.connect(comp).connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  /* A generated impulse response — exponentially decaying stereo noise. It costs one buffer
     and it is the whole difference between a chime and a chime in a room. */
  function room(ctx){
    if (verb) return verb;
    const len = Math.floor(ctx.sampleRate * 2.4);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++){
        const k = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 2.8) * Math.min(1, i / 420);
      }
    }
    verb = ctx.createConvolver();
    verb.buffer = buf;
    verb.connect(master);
    return verb;

    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource();
    s.buffer = b;
    return s;
  }
  function sound(kind){

    const ctx = ctxOf();
    if (!ctx) return;
    const t = ctx.currentTime + .02;
    const bus = ctx.createGain();
    bus.connect(master);
    /* the reverb is shared and permanently wired to the master; each sound only decides how
       much of itself to send, so nothing accumulates connections on it call after call */
    const send = ctx.createGain();
    send.gain.value = kind === "seat" ? .5 : .2;
    send.connect(room(ctx));
    bus.connect(send);

    if (kind === "eject"){
      const c = noiseSrc(ctx, .05);
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 1.2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(.4, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
      c.connect(f).connect(g).connect(bus); c.start(t); c.stop(t + .05);
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(140, t + .13);
      const og = ctx.createGain();
      og.gain.setValueAtTime(.22, t); og.gain.exponentialRampToValueAtTime(.001, t + .16);
      o.connect(og).connect(bus); o.start(t); o.stop(t + .18);
      return;
    }

    const pan = v => { const n = ctx.createStereoPanner(); n.pan.value = v; n.connect(bus); return n; };

    /* 1 · the riser. The old version started at the seat and had nowhere to build from; the
       whole point of an ignition is that you hear it coming. */
    const rise = noiseSrc(ctx, 1.3);
    const rhp = ctx.createBiquadFilter(); rhp.type = "highpass";
    rhp.frequency.setValueAtTime(280, t);
    rhp.frequency.exponentialRampToValueAtTime(4200, t + 1.2);
    const rg = ctx.createGain();
    rg.gain.setValueAtTime(.0001, t);
    rg.gain.exponentialRampToValueAtTime(.085, t + 1.1);
    rg.gain.exponentialRampToValueAtTime(.0001, t + 1.28);
    rise.connect(rhp).connect(rg).connect(bus); rise.start(t); rise.stop(t + 1.3);
    const rsub = ctx.createOscillator(); rsub.type = "sawtooth";
    rsub.frequency.setValueAtTime(26, t);
    rsub.frequency.exponentialRampToValueAtTime(72, t + 1.2);
    const rsl = ctx.createBiquadFilter(); rsl.type = "lowpass"; rsl.frequency.value = 220;
    const rsg = ctx.createGain();
    rsg.gain.setValueAtTime(.0001, t);
    rsg.gain.exponentialRampToValueAtTime(.13, t + 1.15);
    rsg.gain.exponentialRampToValueAtTime(.0001, t + 1.32);
    rsub.connect(rsl).connect(rsg).connect(bus); rsub.start(t); rsub.stop(t + 1.34);

    /* 2 · the shell running down its guides, in time with the .8s travel */
    const slide = noiseSrc(ctx, 1.2);
    const sbp = ctx.createBiquadFilter(); sbp.type = "bandpass"; sbp.Q.value = 1.1;
    sbp.frequency.setValueAtTime(480, t);
    sbp.frequency.exponentialRampToValueAtTime(2300, t + 1.1);
    const sg = ctx.createGain();
    sg.gain.setValueAtTime(.0001, t + .12);
    sg.gain.exponentialRampToValueAtTime(.06, t + .95);
    sg.gain.exponentialRampToValueAtTime(.0001, t + 1.16);
    slide.connect(sbp).connect(sg).connect(bus); slide.start(t); slide.stop(t + 1.2);

    /* 3 · the seat: a hard plastic click over a low thud */
    const T = t + 1.15;
    const clk = noiseSrc(ctx, .06);
    const cbp = ctx.createBiquadFilter(); cbp.type = "bandpass"; cbp.frequency.value = 2700; cbp.Q.value = .8;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(.62, T); cg.gain.exponentialRampToValueAtTime(.001, T + .05);
    clk.connect(cbp).connect(cg).connect(bus); clk.start(T); clk.stop(T + .06);
    const thud = ctx.createOscillator(); thud.type = "sine";
    thud.frequency.setValueAtTime(130, T); thud.frequency.exponentialRampToValueAtTime(46, T + .12);
    const tg = ctx.createGain();
    tg.gain.setValueAtTime(.52, T); tg.gain.exponentialRampToValueAtTime(.001, T + .2);
    thud.connect(tg).connect(bus); thud.start(T); thud.stop(T + .22);

    /* 4 · the machine coming up: detuned saws through a filter opening across half a second */
    const P = T + .02;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 7;
    lp.frequency.setValueAtTime(220, P);
    lp.frequency.exponentialRampToValueAtTime(9000, P + 1.2);
    const pg = ctx.createGain();
    pg.gain.setValueAtTime(.0001, P);
    pg.gain.exponentialRampToValueAtTime(.24, P + 1.15);
    pg.gain.exponentialRampToValueAtTime(.0001, P + 1.42);
    lp.connect(pg).connect(bus);
    [-9, 9].forEach(cents => {
      const o = ctx.createOscillator();
      o.type = "sawtooth"; o.detune.value = cents;
      o.frequency.setValueAtTime(74, P);
      o.frequency.exponentialRampToValueAtTime(430, P + 1.2);
      o.connect(lp); o.start(P); o.stop(P + 1.45);
    });

    /* 5 · the impact, landing with the white: a sub drop under a filtered boom */
    const I = t + 2.45;
    const drop = ctx.createOscillator(); drop.type = "sine";
    drop.frequency.setValueAtTime(150, I);
    drop.frequency.exponentialRampToValueAtTime(32, I + .5);
    const dg = ctx.createGain();
    dg.gain.setValueAtTime(.0001, I);
    dg.gain.exponentialRampToValueAtTime(.62, I + .03);
    dg.gain.exponentialRampToValueAtTime(.0001, I + 2.1);
    drop.connect(dg).connect(bus); drop.start(I); drop.stop(I + 2.2);
    const boom = noiseSrc(ctx, 1.3);
    const blp = ctx.createBiquadFilter(); blp.type = "lowpass";
    blp.frequency.setValueAtTime(1400, I);
    blp.frequency.exponentialRampToValueAtTime(180, I + 1.1);
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(.0001, I);
    bg.gain.exponentialRampToValueAtTime(.34, I + .02);
    bg.gain.exponentialRampToValueAtTime(.0001, I + 1.25);
    boom.connect(blp).connect(bg).connect(bus); boom.start(I); boom.stop(I + 1.3);

    /* 6 · the chord. A full stack rather than a triad, spread across the field, each voice
       opening a little later than the one below it so it blooms rather than hits. */
    const STACK = [65.41, 98.00, 130.81, 164.81, 196.00, 261.63, 329.63, 392.00, 523.25];
    STACK.forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i < 2 ? "sawtooth" : (i > 6 ? "sine" : "triangle");
      o.frequency.value = f;
      o.detune.value = (i % 2 ? 5 : -5);
      const g = ctx.createGain();
      const at = I + .02 + i * .022;
      g.gain.setValueAtTime(.0001, I);
      g.gain.exponentialRampToValueAtTime(.19 / (1 + i * .34), at);
      g.gain.exponentialRampToValueAtTime(.0001, I + 3.4 - i * .16);
      o.connect(g).connect(pan(i % 2 ? .34 : -.34));
      o.start(I); o.stop(I + 3.6);
    });
    /* the shimmer that arrives late and outlasts everything */
    [1046.50, 1567.98].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, I + .1);
      g.gain.exponentialRampToValueAtTime(.055 - i * .02, I + .42);
      g.gain.exponentialRampToValueAtTime(.0001, I + 3.6);
      o.connect(g).connect(pan(i ? .5 : -.5));
      o.start(I + .1); o.stop(I + 3.8);
    });
  }

  const sndBtn = document.getElementById("sndBtn");
  sndBtn.addEventListener("click", () => {
    muted = !muted;
    sndBtn.setAttribute("aria-pressed", String(muted));
    sndBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  });

  /* ---------- the console ---------- */
  const deck     = document.getElementById("console");
  const cart     = document.getElementById("cart");
  const cartPh   = document.getElementById("cartPh");
  const gameName = document.getElementById("gameName");
  const keepBtn  = document.getElementById("keepBtn");
  const dayMark  = document.getElementById("dayMark");
  const flood    = document.getElementById("flood");
  const glow     = document.getElementById("glow");
  let loaded = DAY;

  /* The light a cart brings with it. The shell's own plastic is far too dark and saturated to
     flood a screen with, so only its hue and a fraction of its chroma survive: a takeover in a
     tinted white, warm off the red cart and cold off the teal one, and honestly white for the
     bone and the near-black ones, which is correct — they have no colour to lend. */
  function flare(hex){
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d){
      h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    const l0 = (mx + mn) / 2;
    const s = d ? d / (1 - Math.abs(2 * l0 - 1)) : 0;
    const sat = Math.min(.62, s);
    const hsl = (sm, l, a) => "hsl(" + h.toFixed(0) + " " + (sat * sm * 100).toFixed(0) + "% " +
      (l * 100).toFixed(0) + "%" + (a == null ? "" : " / " + a) + ")";
    for (const el of [glow, flood]){
      el.style.setProperty("--flare", hsl(.5, .94));
      el.style.setProperty("--flare-mid", hsl(1, .74, .55));
      el.style.setProperty("--flare-out", hsl(1, .6, 0));
    }
  }

  /* A cart arrives in the console standing, waiting, nudging — never already playing. Picking
     one off the rack loads it; starting it is always a second, deliberate click. */
  function loadCart(day){
    loaded = day;
    deck.classList.remove("in");
    flood.classList.remove("on");
    glow.classList.remove("on");
    const t = treatment(day);
    /* a cart standing in a slot is upright; the tilt is for the rack only */
    applyPhoto(cartPh, t, 1.06, 1, true);
    flare(CART_ART[t.art].c);
    gameName.textContent = (GAMES[day - 1] || {}).n || "";
    const kept = collected.has(day);
    keepBtn.hidden = kept;
    dayMark.hidden = !kept;
    cart.setAttribute("aria-label", label(day, "push in to play"));
    if (!REDUCED) cart.classList.add("waiting");
  }
  const label = (day, verb) => {
    const g = GAMES[day - 1];
    return "Cartridge " + pad3(day) + (g ? ", " + g.n : "") + ", " + verb;
  };

  /* Seating a cart IS starting the game, so there is no separate play button. The flood is
     restarted by hand because a class already on the element will not replay its animation,
     and its origin is written from the mouth's live rect so the light comes out of the slot
     wherever the page happens to be scrolled to. */
  let ignite = null, launch = null;
  function seat(){
    if (deck.classList.contains("in")) return;
    cart.classList.remove("waiting");
    deck.classList.add("in");
    cart.setAttribute("aria-label", label(loaded, "pull out to cancel"));
    sound("seat");
    /* the game arrives as the light peaks. Pulling the cart back out before then cancels it. */
    const game = GAMES[loaded - 1];
    clearTimeout(launch);
    if (game) launch = setTimeout(() => {
      window.tally && tally("play", { game: game.s, day: loaded });
      location.href = game.u;
    }, REDUCED ? 1700 : 2600);
    if (REDUCED) return;
    /* Both light layers are aimed at the slot's live rect, so wherever the page is scrolled
       to, the glow rises from behind the machine and the flood breaks out of the same point.
       The glow is BEHIND the machine, which silhouettes it for a beat before the white. */
    const m = document.querySelector(".mouth").getBoundingClientRect();
    const fx = (m.left + m.width / 2) + "px", fy = (m.top + m.height / 2) + "px";
    for (const el of [glow, flood]){
      el.style.setProperty("--fx", fx);
      el.style.setProperty("--fy", fy);
      el.classList.remove("on");
    }
    void flood.offsetWidth;
    glow.classList.add("on");
    clearTimeout(ignite);
    ignite = setTimeout(() => flood.classList.add("on"), 1300);
  }
  function eject(){
    clearTimeout(ignite);
    clearTimeout(launch);
    deck.classList.remove("in");
    flood.classList.remove("on");
    glow.classList.remove("on");
    cart.setAttribute("aria-label", label(loaded, "push in to play"));
    if (!REDUCED) cart.classList.add("waiting");
    sound("eject");
  }

  cart.addEventListener("click", () => {
    deck.classList.contains("in") ? eject() : seat();
  });

  keepBtn.addEventListener("click", () => {
    collected.add(loaded);
    const g = GAMES[loaded - 1];
    if (g){ const subs = readStream(); subs.add(g.s); writeStream(subs); }
    window.tally && tally("keep", { game: g ? g.s : "", day: loaded });
    keepBtn.hidden = true;
    dayMark.hidden = false;
    refreshTile(loaded);
    refreshKept();
    if (view === "feed") layout(true);
  });

  /* ---------- the rack ----------
     The rack does NOT draw a hundred slots. Ninety-odd empty boxes is a long scroll that says
     nothing you cannot say in a line, and it buries the carts that actually exist. It draws
     what has arrived, tomorrow's as a ghost at the head of the queue, and only enough empty
     slots to finish the row it is standing in — so the row always reads as a rack rather than
     a ragged edge. The count at the top of the page already says how many there will be. */
  const grid = document.getElementById("grid");
  const nowt = document.getElementById("nowt");
  const viewAll = document.getElementById("viewAll");
  const viewFeed = document.getElementById("viewFeed");
  const tiles = [];
  const TOMORROW = DAY + 1;

  function stateOf(day){
    if (day === TOMORROW) return "tomorrow";
    if (day > DAY) return "locked";
    if (day === DAY) return "today";
    if (collected.has(day)) return "collected";
    return "sealed";
  }

  /* the column count is CSS's decision, not the script's — read it back rather than guess */
  function columns(){
    return getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length;
  }
  function shownCount(){
    const c = Math.max(1, columns());
    return Math.min(100, Math.ceil(TOMORROW / c) * c);
  }

  /* ALL CARTS is the shelf as it fills: everything that has arrived, tomorrow's as a ghost,
     and enough empty slots to finish the row. YOUR FEED is only what you subscribed to —
     no ghost and no fillers, because nothing more is coming to it on its own. */
  const VIEW = "carts.view";
  let view = "all";
  try { if (localStorage.getItem(VIEW) === "feed") view = "feed"; } catch (e){}
  function days(){
    if (view === "feed") return [...collected].sort((a, b) => a - b);
    const out = [];
    for (let d = 1; d <= shownCount(); d++) out.push(d);
    return out;
  }

  function buildTile(day){
    const b = document.createElement("button");
    b.className = "tile";
    b.dataset.day = day;
    b.dataset.a = "tile";
    grid.appendChild(b);
    tiles[day] = b;
    refreshTile(day);
    b.addEventListener("click", () => {
      const s = stateOf(day);
      /* Every cart in the rack is a game that exists — the only tiles that cannot be loaded
         are the empty slots and tomorrow's, which has not arrived. Gating on "today or
         already kept" was inherited from the tins, where a day you missed was gone; here it
         meant hovering a cart, watching it lift, clicking it and getting a shrug. */
      if (s === "locked" || s === "tomorrow"){
        if (!REDUCED){
          b.classList.remove("settling");
          void b.offsetWidth;
          b.classList.add("settling");
        }
        return;
      }
      /* carry it down to the console and leave it standing there. It nudges until someone
         pushes it in — starting a game is never something the page does on your behalf. */
      loadCart(day);
      deck.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block:"end" });
    });
  }

  function refreshTile(day){
    const b = tiles[day];
    if (!b) return;
    const s = stateOf(day);
    b.className = "tile " + s + (s === "locked" ? "" : " has-photo");
    b.innerHTML = "";
    b.setAttribute("aria-label", s === "tomorrow" ? "Tomorrow" :
      (GAMES[day - 1] ? "Cartridge " + pad3(day) + ", " + GAMES[day - 1].n : "Cartridge " + pad3(day)));
    if (s === "locked"){
      const n = document.createElement("span");
      n.className = "num";
      n.textContent = pad3(day);
      b.appendChild(n);
      return;
    }
    const t = treatment(day);
    const ph = document.createElement("span");
    ph.className = "ph";
    if (s === "tomorrow")    applyPhoto(ph, t, .5, .7);
    /* not in the stream yet, but perfectly playable — a light hand, not a disabled look */
    else if (s === "sealed") applyPhoto(ph, t, .92, .94);
    else if (s === "today")  applyPhoto(ph, t, 1.1, 1.02);
    else                     applyPhoto(ph, t, 1, 1);
    b.appendChild(ph);
    if (s === "tomorrow"){
      const l = document.createElement("span");
      l.className = "soon";
      l.textContent = "TOMORROW";
      b.appendChild(l);
      return;
    }
    if (GAMES[day - 1]){
      const l = document.createElement("span");
      l.className = "lbl";
      l.textContent = GAMES[day - 1].n;
      b.appendChild(l);
    }
    /* the punch mark is the subscription, so today wears it too once it is in the stream */
    if (collected.has(day)){
      const m = document.createElement("span");
      m.className = "mark";
      b.appendChild(m);
      if (refilled.has(day)){
        const p = document.createElement("span");
        p.className = "pip";
        b.appendChild(p);
      }
    }
  }

  function refreshKept(){
    document.getElementById("keptNum").textContent = pad2(collected.size);
  }

  /* A cartridge is one object: it has to be the same size standing in the machine as it is
     sitting on the shelf. The rack's column width is `1fr` of whatever the grid decided, so
     it is measured rather than recomputed, and handed to the console as its unit. */
  function sizeMachine(){
    const t = tiles[1];
    if (!t) return;
    const tile = t.getBoundingClientRect().width;
    if (!tile) return;
    /* The machine matches the rack — until matching it would push the cart off the screen.
       A one-column phone hands over a tile nearly as wide as the window, and a cartridge that
       wide makes the console taller than the viewport, so you never see more than half a cart
       at a time. Nothing is clipped; it simply does not fit. So the machine's cart is capped
       to what leaves room for the body of the machine underneath it, which on a desktop is
       never the binding constraint and on a phone always is. */
    const a = parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue("--cart-a")) || .623;
    const vh = innerHeight;
    const body = Math.min(300, Math.max(210, vh * .29));
    const air = Math.min(52, Math.max(22, vh * .04));
    const room = Math.max(200, vh - body - air - 16) * a;
    deck.style.setProperty("--cart-w", Math.round(Math.min(tile, room)) + "px");
  }
  let drawn = "";
  function layout(force){
    const list = days();
    const key = view + ":" + list.join(",");
    if (force || key !== drawn){
      drawn = key;
      grid.textContent = "";
      tiles.length = 0;
      list.forEach(buildTile);
    }
    nowt.hidden = list.length > 0;
    viewAll.setAttribute("aria-selected", String(view === "all"));
    viewFeed.setAttribute("aria-selected", String(view === "feed"));
    sizeMachine();
  }
  for (const b of [viewAll, viewFeed]) b.addEventListener("click", () => {
    view = b.dataset.view;
    try { localStorage.setItem(VIEW, view); } catch (e){}
    layout();
  });
  layout();
  let relayout;
  addEventListener("resize", () => { clearTimeout(relayout); relayout = setTimeout(layout, 180); });

  refreshKept();
  document.getElementById("dayNum").textContent = pad3(DAY);

  loadCart(DAY);
</script>
<script defer src="__ARCADE__/t.js"></script>
